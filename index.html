<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="d-flex flex-column align-items-center corp">
        <h3 class="mt-3 mb-5">Selectionnez une chambre</h3>
        
        <div>
            <label for="searchRoom"></label>
            <select id="searchRoom">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
            <button class="glass-btn" id="btn-valider">OK</button>
        </div>
        <div id="display-room">
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-danger mt-4 m-3 d-none" id="btn-liberer">Libérer la chambre</button>
            <button class="btn btn-success mt-4 m-3 d-none" id="btn-reserver">Reserver la chambre</button>
        </div>

        <button class="btn btn-primary m-5" id="btn-display-all">Afficher toutes les Chambres</button>
        <div id="tab-container" class="d-flex justify-content-center w-75">
            <p id="tab" class="text-justify"></p>
        </div>

    </div>
    
    <script type="module" src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
